# Synapse local stack.
# Run from repo root: docker compose up -d
#
# What you get:
#   postgres   — metadata DB for synapse (persisted in named volume)
#   synapse    — control-plane API on host port 8080
#   dashboard  — Next.js dashboard on host port 6790
#
# Synapse provisions Convex backend containers on the synapse-network,
# bound to host ports in the configured range (default 3210-3500).
# It needs access to the Docker socket on the host.

name: synapse

services:
  postgres:
    image: postgres:16-alpine
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    volumes:
      - synapse-pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-network

  synapse:
    build:
      context: ./synapse
      args:
        VERSION: ${SYNAPSE_VERSION:-dev}
    # Tagged :local because SYNAPSE_VERSION is human-readable and may
    # contain characters Docker rejects in tags (e.g. `feat/foo`).
    # The version stamp lives in .env + the binary's compile-time
    # constant + .upgrade-snapshot.tsv (image_id) — the docker tag
    # itself doesn't need to track it.
    image: synapse:local
    container_name: synapse-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_HTTP_ADDR: 0.0.0.0:8080
      SYNAPSE_DB_URL: postgres://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@postgres:5432/${POSTGRES_DB:-synapse}?sslmode=disable
      SYNAPSE_JWT_SECRET: ${SYNAPSE_JWT_SECRET}
      SYNAPSE_JWT_ACCESS_TTL: ${SYNAPSE_JWT_ACCESS_TTL:-24h}
      SYNAPSE_JWT_REFRESH_TTL: ${SYNAPSE_JWT_REFRESH_TTL:-720h}
      SYNAPSE_DOCKER_HOST: unix:///var/run/docker.sock
      # v1.7.1+: upstream image pinned to a known-good dated tag instead
      # of the rolling :latest. Upstream releases near-daily with empty
      # release notes; pinning gives operators a deterministic bump
      # cadence. To bump: change the tag here AND in installer/templates/
      # env.tmpl, installer/install/lifecycle.sh, synapse/internal/config
      # /config.go, setup.sh, .github/workflows/ci.yml — all must move
      # together so installs / upgrades / tests stay in lock-step.
      SYNAPSE_BACKEND_IMAGE: ${SYNAPSE_BACKEND_IMAGE:-ghcr.io/get-convex/convex-backend@sha256:19481d5e9309db4a87a9a2e9d12a6930bd12569e1fc96276d9fa0aae53a106b6}
      SYNAPSE_DOCKER_NETWORK: synapse-network
      SYNAPSE_PORT_RANGE_MIN: ${SYNAPSE_PORT_RANGE_MIN:-3210}
      SYNAPSE_PORT_RANGE_MAX: ${SYNAPSE_PORT_RANGE_MAX:-3500}
      SYNAPSE_HEALTHCHECK_VIA_NETWORK: "true"
      # Mount /d/{name}/* on the API listener. Required for the proxy.spec.ts
      # e2e test; safe to leave on in dev — when off, /d/* simply 404s.
      SYNAPSE_PROXY_ENABLED: ${SYNAPSE_PROXY_ENABLED:-true}
      # SYNAPSE_PUBLIC_URL controls how /auth, /cli_credentials, and the
      # GET /v1/deployments/* handlers rewrite the deployment URL the
      # provisioner stored ("http://127.0.0.1:<port>") into something a
      # remote browser/CLI can reach. Without this passthrough the
      # backend has no way to know what hostname operators front it
      # with, and the dashboard/CLI render loopback URLs. Empty in
      # local dev (no rewrite); setup.sh sets it to "https://<domain>"
      # or "http://<public-ip>:<port>" depending on --no-tls.
      SYNAPSE_PUBLIC_URL: ${SYNAPSE_PUBLIC_URL:-}
      # SYNAPSE_DOMAIN (v1.19+) — the FQDN where the dashboard + API
      # live (e.g. synapsepanel.com). Mirror of the operator's setup
      # answer; distinct from SYNAPSE_BASE_DOMAIN (which is the
      # wildcard for per-deployment subs). Admin → Remote Hosts uses
      # it to derive the default Headscale subdomain
      # (headscale.<SYNAPSE_DOMAIN>) — without this passthrough the
      # api process would see an empty value and the dashboard's
      # Remote Hosts panel would refuse with "Host domain required"
      # even on a properly-configured TLS install. v1.19.0 shipped
      # without this, surfaced on the first real-VPS smoke; v1.19.1
      # added the wire-up.
      SYNAPSE_DOMAIN: ${SYNAPSE_DOMAIN:-}
      # SYNAPSE_BASE_DOMAIN (v1.0+) — wildcard subdomain for per-
      # deployment URLs. When set, deployment URLs become
      # "https://<name>.<base>" and the proxy accepts Host-header
      # routing. /v1/internal/tls_ask gates Caddy on-demand TLS.
      # Same pattern as SYNAPSE_PUBLIC_URL above: lives in .env, MUST
      # be passed through the environment block to actually reach the
      # binary (real-VPS smoke caught this missing in v1.0 chunk 1).
      SYNAPSE_BASE_DOMAIN: ${SYNAPSE_BASE_DOMAIN:-}
      # SYNAPSE_PUBLIC_IP (v1.1+) — IPv4 the operator publishes in DNS
      # for per-deployment custom domains. The /v1/deployments/{name}
      # /domains POST + verify handlers gate status='active' on a
      # successful A-record match. Empty disables DNS preflight (rows
      # stay status='pending' with a helpful last_dns_error).
      SYNAPSE_PUBLIC_IP: ${SYNAPSE_PUBLIC_IP:-}
      # Resend transactional email (v1.22+) — enables the team-invite email.
      # SYNAPSE_RESEND_API_KEY is the Resend API key; SYNAPSE_EMAIL_FROM is the
      # Resend-verified sender ("Synapse <no-reply@you.com>"). BOTH are required
      # to send (email.New treats either-missing as disabled); empty (default)
      # leaves invites link-only. MUST live in this environment block to reach
      # the binary — same passthrough rule as SYNAPSE_PUBLIC_URL / BASE_DOMAIN.
      SYNAPSE_RESEND_API_KEY: ${SYNAPSE_RESEND_API_KEY:-}
      SYNAPSE_EMAIL_FROM: ${SYNAPSE_EMAIL_FROM:-}
      # CORS — locked to the dashboard origin in production. Defaults
      # to "*" for local dev so a browser opened against an arbitrary
      # IP/port can still call the API.
      SYNAPSE_ALLOWED_ORIGINS: ${SYNAPSE_ALLOWED_ORIGINS:-*}
      SYNAPSE_LOG_LEVEL: ${SYNAPSE_LOG_LEVEL:-info}
      # Optional Aster runtime bridge. When SYNAPSE_ASTER_POSTGRES_URL is set,
      # kind=aster brokerds run ASTER_STORE=postgres against that database.
      # SYNAPSE_ASTER_MODULES_DIR must be a Docker-host path to Convex's
      # modules directory (`.../modules`), mounted read-only into brokerd.
      SYNAPSE_ASTER_POSTGRES_URL: ${SYNAPSE_ASTER_POSTGRES_URL:-}
      SYNAPSE_ASTER_DB_SCHEMA: ${SYNAPSE_ASTER_DB_SCHEMA:-public}
      SYNAPSE_ASTER_MODULES_DIR: ${SYNAPSE_ASTER_MODULES_DIR:-}
      # Self-update daemon (v1.5.1+) — TCP + bearer token.
      # The synapse-updater systemd unit on the host listens on
      # 0.0.0.0:8089 (must accept the docker-bridge IP that
      # host.docker.internal resolves to inside this container —
      # 127.0.0.1-only would refuse the bridge connection). Operator
      # firewall MUST keep 8089 closed to the public internet; the
      # bearer token is defense-in-depth only.
      # Bearer token is rendered into .env by phase_secrets and stays
      # sticky across re-renders (rotating it would orphan every
      # already-running synapse-api). Default URL keeps local-dev
      # working when the daemon isn't installed (the admin endpoint
      # returns 503 on connection refused).
      SYNAPSE_UPDATER_URL: ${SYNAPSE_UPDATER_URL:-http://host.docker.internal:8089}
      SYNAPSE_UPDATER_TOKEN: ${SYNAPSE_UPDATER_TOKEN:-}
      # Storage envelope key (v0.5+). Required for the HA flow (encrypts
      # deployment_storage Postgres URL + S3 keys at rest) AND the v1.5+
      # DNS credentials flow (encrypts Cloudflare API tokens). The
      # installer generates SYNAPSE_STORAGE_KEY idempotently in .env;
      # without this passthrough the container never sees it and Crypto
      # initialisation silently degrades to nil. Field-discovered on a
      # fresh KVM4 install where /v1/admin/dns_credentials/cloudflare
      # panicked on EncryptString of a typed-nil interface.
      SYNAPSE_STORAGE_KEY: ${SYNAPSE_STORAGE_KEY:-}
      # HA mode envs (v0.5+). Same passthrough story — missing from the
      # container env meant ha:true was effectively disabled even when
      # SYNAPSE_HA_ENABLED=true was in .env. Defaults keep non-HA
      # installs unaffected.
      SYNAPSE_HA_ENABLED: ${SYNAPSE_HA_ENABLED:-false}
      SYNAPSE_BACKEND_POSTGRES_URL: ${SYNAPSE_BACKEND_POSTGRES_URL:-}
      SYNAPSE_BACKEND_S3_ENDPOINT: ${SYNAPSE_BACKEND_S3_ENDPOINT:-}
      SYNAPSE_BACKEND_S3_REGION: ${SYNAPSE_BACKEND_S3_REGION:-}
      SYNAPSE_BACKEND_S3_ACCESS_KEY: ${SYNAPSE_BACKEND_S3_ACCESS_KEY:-}
      SYNAPSE_BACKEND_S3_SECRET_KEY: ${SYNAPSE_BACKEND_S3_SECRET_KEY:-}
      SYNAPSE_BACKEND_S3_BUCKET_PREFIX: ${SYNAPSE_BACKEND_S3_BUCKET_PREFIX:-}
      # ---- Cell Control Plane (v1.12+) ----
      # observe/plan-only control surface. Defaults match config.go
      # so a fresh install behaves identically to the v1.11.x baseline;
      # operators can override per-host (e.g. SYNAPSE_REGION=eu-west-1)
      # via .env. SYNAPSE_AGENT_APPLY is hard-coded to false here too
      # — the AGENT never applies; the var exists so the surface is
      # explicit and audit-grep-able.
      SYNAPSE_ENABLE_CELLS: ${SYNAPSE_ENABLE_CELLS:-true}
      SYNAPSE_REGION: ${SYNAPSE_REGION:-}
      SYNAPSE_AGENT_STALE_AFTER_SECONDS: ${SYNAPSE_AGENT_STALE_AFTER_SECONDS:-60}
      SYNAPSE_AGENT_OFFLINE_AFTER_SECONDS: ${SYNAPSE_AGENT_OFFLINE_AFTER_SECONDS:-300}
      SYNAPSE_ENABLE_DESIRED_STATE: ${SYNAPSE_ENABLE_DESIRED_STATE:-true}
      SYNAPSE_ENABLE_OBSERVED_STATE: ${SYNAPSE_ENABLE_OBSERVED_STATE:-true}
      SYNAPSE_ENABLE_RECONCILE_DRY_RUN: ${SYNAPSE_ENABLE_RECONCILE_DRY_RUN:-true}
      SYNAPSE_AGENT_APPLY: ${SYNAPSE_AGENT_APPLY:-false}
      # Bloco 10 — central-driven apply (create/restart). OFF by default.
      # SYNAPSE_APPLY_DANGEROUS gates the Phase-2 stop/remove actions.
      SYNAPSE_APPLY_ENABLED: ${SYNAPSE_APPLY_ENABLED:-false}
      SYNAPSE_APPLY_DANGEROUS: ${SYNAPSE_APPLY_DANGEROUS:-false}
      # ---- Auto-restart + meta + dashboard upstream ----
      # SYNAPSE_HEALTH_AUTO_RESTART: empty = disabled. The health worker
      # only promotes 'stopped' → restart attempt when this is "true".
      # SYNAPSE_GITHUB_REPO: where the auto-updater fetches /releases/latest.
      # Override for forks ("my-org/my-fork").
      # SYNAPSE_DASHBOARD_UPSTREAM / SYNAPSE_DASHBOARD_SHELL_UPSTREAM: the
      # service names the proxy proxies to. Override only if you renamed
      # the convex-dashboard / synapse-dashboard services in compose.
      SYNAPSE_HEALTH_AUTO_RESTART: ${SYNAPSE_HEALTH_AUTO_RESTART:-}
      SYNAPSE_GITHUB_REPO: ${SYNAPSE_GITHUB_REPO:-Iann29/convex-synapse}
      SYNAPSE_DASHBOARD_UPSTREAM: ${SYNAPSE_DASHBOARD_UPSTREAM:-synapse-convex-dashboard-proxy:80}
      SYNAPSE_DASHBOARD_SHELL_UPSTREAM: ${SYNAPSE_DASHBOARD_SHELL_UPSTREAM:-synapse-dashboard:3000}
      # Headscale integration (v1.18+, requires `--profile headscale`).
      # When SYNAPSE_HEADSCALE_URL is non-empty, Synapse-API talks to
      # the Headscale HTTP API at that URL (Bearer-auth via
      # SYNAPSE_HEADSCALE_API_KEY) to mint pre-auth keys + list/delete
      # tailnet nodes for the Remote Hosts feature. Empty = disabled.
      # The URL here is the INTERNAL docker-network address
      # (synapse-headscale:8080), NOT the external server_url that
      # Tailscale clients hit during `tailscale up --login-server=...`
      # — that one lives in installer/templates/headscale.config.yaml
      # .tmpl as `server_url:`.
      SYNAPSE_HEADSCALE_URL: ${SYNAPSE_HEADSCALE_URL:-}
      SYNAPSE_HEADSCALE_API_KEY: ${SYNAPSE_HEADSCALE_API_KEY:-}
      # SYNAPSE_HEADSCALE_SERVER_URL: the EXTERNAL URL Tailscale
      # clients pass to `tailscale up --login-server=...`. Distinct
      # from SYNAPSE_HEADSCALE_URL (above) which is the docker-
      # internal API address. Served back to install-agent.sh via
      # the public /v1/install_agent/config endpoint so the
      # dashboard one-liner doesn't have to carry it inline.
      SYNAPSE_HEADSCALE_SERVER_URL: ${SYNAPSE_HEADSCALE_SERVER_URL:-}
      # SYNAPSE_HEADSCALE_DOMAIN (v1.19+): the operator's chosen
      # Headscale subdomain (e.g. headscale.synapsepanel.com), used
      # as the authoritative source by Admin → Remote Hosts.
      # Persisted by setup.sh::headscale::bootstrap after the first
      # configure run; empty on a fresh-install / pre-configure
      # state. Without this passthrough the v1.19.0 dashboard would
      # silently fall back to deriving from SYNAPSE_DOMAIN /
      # SYNAPSE_BASE_DOMAIN on every GET, even after the operator
      # explicitly stamped an override in .env — clobbering the
      # form pre-fill.
      SYNAPSE_HEADSCALE_DOMAIN: ${SYNAPSE_HEADSCALE_DOMAIN:-}
      # Deployment-down alerts (v1.26+): .env fallback webhook. The DB
      # row (Admin → Alerts) wins entirely over this when present.
      SYNAPSE_ALERT_WEBHOOK_URL: ${SYNAPSE_ALERT_WEBHOOK_URL:-}
      # Per-deployment snapshot backups (v1.26+): where the api (and the
      # transient CLI containers it spawns) read/write backup zips. Must
      # agree with the synapse-backups volume mount below.
      SYNAPSE_BACKUP_DIR: ${SYNAPSE_BACKUP_DIR:-/backups}
    volumes:
      # Synapse provisions sibling containers via the host docker daemon.
      # This mount is unavoidable for the v0 architecture; the alternative is
      # rootless docker-in-docker, which is out of scope.
      - /var/run/docker.sock:/var/run/docker.sock
      # install-agent.sh served at GET /v1/install_agent/script (v1.19.4+).
      # The Remote Hosts one-liner curls that path; without the script
      # mounted, the endpoint 503s. Read-only — the api only reads it.
      # The file ships in the repo + is rsync'd into INSTALL_DIR by the
      # installer, so the relative ./install-agent.sh resolves next to
      # this compose file.
      - ./install-agent.sh:/install-agent.sh:ro
      # Per-deployment snapshot backups (v1.26+). The transient CLI
      # containers the backend spawns bind the SAME named volume (fixed
      # name, no compose project prefix) and write the zips; the api
      # streams downloads + prunes retention through this mount. The
      # target tracks SYNAPSE_BACKUP_DIR so an operator override can't
      # split the env (where Go reads/writes) from the volume (where
      # the zips actually land).
      - synapse-backups:${SYNAPSE_BACKUP_DIR:-/backups}
    extra_hosts:
      # host-gateway is a docker 20.10+ magic alias the daemon expands
      # at container-create time to the host's bridge IP. Lets the
      # synapse-api container reach the synapse-updater systemd daemon
      # on 127.0.0.1:8089 (the host loopback). The previous design used
      # a /run/synapse unix-socket bind mount; switching to TCP+bearer
      # decouples the container from any host filesystem layout and
      # lets the daemon stay reachable across host filesystem changes.
      - "host.docker.internal:host-gateway"
    ports:
      - "${SYNAPSE_PORT:-8080}:8080"
    networks:
      - synapse-network

  dashboard:
    build:
      context: ./dashboard
      # NEXT_PUBLIC_* vars are inlined into the JS bundle at *build*
      # time — Next.js doesn't read them at runtime. We MUST pass the
      # public URLs as build args, not just as runtime envs. The
      # `environment:` block below is kept as a hint for any code
      # path that still consults process.env at runtime, but the
      # browser-shipped JS comes from these build args.
      args:
        NEXT_PUBLIC_SYNAPSE_URL: ${PUBLIC_SYNAPSE_URL:-http://localhost:8080}
        # URL of the open-source Convex Dashboard (the data/functions/
        # logs UI for a single deployment). Synapse runs it as the
        # convex-dashboard service below; setup.sh wires this to
        # https://<domain>:6791 (TLS-fronted by Caddy since v1.6.12)
        # or http://<vps-ip>:6791 for --no-tls installs.
        NEXT_PUBLIC_CONVEX_DASHBOARD_URL: ${PUBLIC_CONVEX_DASHBOARD_URL:-http://localhost:6791}
        # Same stamp the Go binary bakes via main.Version. Lets the
        # browser prove which dashboard build it loaded — operator can
        # check front vs back on /me to spot a stale browser cache.
        NEXT_PUBLIC_DASHBOARD_VERSION: ${SYNAPSE_VERSION:-dev}
    image: synapse-dashboard:local
    container_name: synapse-dashboard
    restart: unless-stopped
    depends_on:
      - synapse
    environment:
      # Same values as the build args above; redundant for the
      # browser bundle but useful if any server-side render path
      # reads them at runtime.
      NEXT_PUBLIC_SYNAPSE_URL: ${PUBLIC_SYNAPSE_URL:-http://localhost:8080}
      NEXT_PUBLIC_CONVEX_DASHBOARD_URL: ${PUBLIC_CONVEX_DASHBOARD_URL:-http://localhost:6791}
    ports:
      - "${DASHBOARD_PORT:-6790}:3000"
    networks:
      - synapse-network

  # ----------------------------------------------------------------
  # Open-source Convex Dashboard. The "data / functions / logs /
  # schedules / files" UI for a single deployment — Convex publishes
  # this as a separate image on ghcr.io. The Synapse dashboard's
  # "Open dashboard" button targets it via NEXT_PUBLIC_CONVEX_DASHBOARD_URL
  # (baked into the dashboard build above). The image embeds a static
  # bundle that takes deploymentName / adminKey / deploymentUrl from
  # the URL hash and connects to the backend over the public network,
  # so this container needs no special networking — just a public
  # port. Each deployment's data flows: operator's browser →
  # convex-dashboard (static) → operator's browser → Synapse proxy
  # /d/<name>/* → convex backend container. The dashboard itself
  # never touches the data; it's just the UI shell.
  # ----------------------------------------------------------------

  convex-dashboard:
    # v1.7.1+: convex-dashboard upstream publishes only `:latest` (no
    # dated tags like convex-backend). Pin by SHA digest for the same
    # determinism guarantee — `image@sha256:…` resolves a specific
    # immutable layer, ignoring future `:latest` repulls. Bump the
    # digest when bumping the backend tag above; the two move
    # together because upstream builds them in lock-step.
    #
    # Current digest = ghcr.io :latest as of 2026-05-21.
    image: ghcr.io/get-convex/convex-dashboard@sha256:f91bb4d45db6f1ab7caafbc97f86a1274e3e6907d8b003f38c5fddc97efb6709
    container_name: synapse-convex-dashboard
    restart: unless-stopped
    # NOTE: no `ports:` here — the upstream image emits anti-iframe
    # headers (X-Frame-Options + frame-ancestors CSP) that block
    # Synapse's /embed/<name> shell from rendering the dashboard.
    # The convex-dashboard-proxy sidecar below strips those headers
    # and is what operators actually hit on port 6791.
    expose:
      - "6791"
    networks:
      - synapse-network

  # ----------------------------------------------------------------
  # Tiny Caddy reverse-proxy in front of convex-dashboard. The
  # upstream image's X-Frame-Options + CSP frame-ancestors prevent
  # iframe embedding; this sidecar strips both so the Synapse
  # dashboard's `/embed/<name>` shell can iframe it and reply to
  # the postMessage handshake that auto-logs the dashboard. Strip
  # is safe because the /embed page itself sits behind Synapse auth.
  # ----------------------------------------------------------------

  convex-dashboard-proxy:
    image: caddy:2-alpine
    container_name: synapse-convex-dashboard-proxy
    restart: unless-stopped
    depends_on:
      - convex-dashboard
    # v1.6.12+: NO host-port mapping. The Synapse Caddy fronts :6791
    # with TLS (see installer/templates/caddy.standalone) and proxies
    # internally to this sidecar over the synapse-network. Host-Caddy
    # installs do the same via installer/templates/caddy.fragment.
    # Pre-v1.6.12 we mapped 6791:80 here and the operator's iframe
    # hit https://<domain>:6791 over plain HTTP — Mixed Content
    # blocks under HTTPS parent pages, TLS handshake fail under
    # TLS-fronted pages. TLS-by-Caddy is the cure.
    #
    # Trade-off: --no-tls installs (no Caddy) lose direct host access
    # to the Convex Dashboard image. Operators in that mode can
    # re-enable it with a `docker compose -f docker-compose.yml -f
    # docker-compose.no-tls.yml up -d` override, or run setup.sh with
    # --domain so Caddy provides the TLS path natively.
    expose:
      - "80"
    volumes:
      - ./installer/templates/convex-dashboard.caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - synapse-network

  # ----------------------------------------------------------------
  # HA test profile (v0.5+). Started with `docker compose --profile ha
  # up -d`; idle when the profile isn't selected. These services back
  # the SYNAPSE_HA_E2E real-backend test (see docs/HA_TESTING.md);
  # they are NOT what Synapse-managed deployments use as their backing
  # store in production — the operator points Synapse at managed
  # Postgres + S3 there.
  # ----------------------------------------------------------------

  backend-postgres:
    image: postgres:16-alpine
    container_name: synapse-backend-pg
    profiles: ["ha"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HA_PG_USER:-convex}
      POSTGRES_PASSWORD: ${HA_PG_PASSWORD:-convex}
      POSTGRES_DB: postgres
    volumes:
      - synapse-backend-pgdata:/var/lib/postgresql/data
    ports:
      - "${HA_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HA_PG_USER:-convex} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-network

  minio:
    image: minio/minio:latest
    container_name: synapse-minio
    profiles: ["ha"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HA_S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${HA_S3_SECRET:-minioadmin}
    volumes:
      - synapse-minio-data:/data
    ports:
      - "${HA_S3_PORT:-9000}:9000"
      - "${HA_S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-network

  # ----------------------------------------------------------------
  # Caddy reverse-proxy profile (v0.6+). Activated by the auto-
  # installer when the host has no existing reverse proxy
  # (`./setup.sh` writes a Caddyfile from installer/templates/
  # caddy.standalone and brings this service up). Operators with
  # their own Caddy/nginx don't get a port-80 conflict because the
  # service is idle when the `caddy` profile isn't selected.
  # ----------------------------------------------------------------

  caddy:
    image: caddy:2-alpine
    container_name: synapse-caddy
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - synapse
      - dashboard
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      # v1.6.12+: TLS-fronted Convex Dashboard iframe URL. Caddy
      # terminates TLS here and reverse-proxies to convex-dashboard-
      # proxy:80 (internal-only since v1.6.12). The block lives in
      # caddy.standalone next to the {{DOMAIN}} site config.
      - "${CONVEX_DASHBOARD_PORT:-6791}:6791"
    volumes:
      # Operator's rendered Caddyfile (written by
      # installer/install/caddy.sh::write_standalone). Default path
      # matches setup.sh's /opt/synapse/Caddyfile convention; the
      # repo-root fallback keeps `docker compose --profile caddy up`
      # usable from a fresh clone without invoking setup.sh first.
      - ${SYNAPSE_CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - synapse-caddy-data:/data
      - synapse-caddy-config:/config
    networks:
      - synapse-network

  # ----------------------------------------------------------------
  # Headscale (v1.18+, optional). Self-hosted Tailscale control plane,
  # activated by `setup.sh --enable-headscale` (sets the `headscale`
  # compose profile). Powers the Remote Hosts feature: Tailscale clients
  # on operator-added VPSes register here, get an IP in 100.64.0.0/10,
  # and Synapse central reaches them via that tailnet IP (no public
  # ports needed on the remote VPS).
  #
  # Why we ship Headscale self-hosted instead of using Tailscale's
  # managed control plane: zero third-party dependency on the identity
  # path. WireGuard tunnels are still P2P direct between machines (DERP
  # is a fallback only); only the "who's who" coordination layer
  # lives on the operator's Synapse host.
  #
  # Storage: dedicated 'headscale' database on the same Postgres
  # cluster as Synapse metadata (auto-migrated on first start).
  #
  # No host-port mapping: external traffic comes through Caddy on
  # `headscale.<base-domain>`. Operators on --no-tls cannot enable
  # Headscale (setup.sh --enable-headscale requires --domain /
  # --base-domain — the Tailscale clients need a stable HTTPS URL
  # to register). `expose: 8080` keeps the port reachable from
  # Caddy on the synapse-network bridge without publishing it.
  # ----------------------------------------------------------------

  headscale:
    image: ghcr.io/juanfont/headscale:v0.28.0
    container_name: synapse-headscale
    profiles: ["headscale"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve"]
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - synapse-headscale-data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - synapse-network

volumes:
  synapse-pgdata:
  synapse-backend-pgdata:
  synapse-minio-data:
  synapse-caddy-data:
  synapse-caddy-config:
  synapse-headscale-data:
  # Fixed name (no project prefix): the backend's transient backup/restore
  # containers bind this volume by literal name via the Docker SDK.
  synapse-backups:
    name: synapse-backups

networks:
  synapse-network:
    name: synapse-network
    driver: bridge
