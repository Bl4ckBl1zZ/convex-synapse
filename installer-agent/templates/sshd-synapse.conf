# /etc/ssh/sshd_config.d/synapse-deployer.conf
# Generated by install-agent.sh — do not edit (re-run install-agent.sh to update).
#
# This drop-in constrains what the synapse-deployer user is allowed to do
# over SSH on this host. The host's main sshd config (port 22 on 0.0.0.0)
# stays untouched — operators can still SSH as themselves the usual way.
#
# {{TAILNET_IP}} is the host's tailnet IPv4 (100.x.x.x) at install time;
# left as a comment for operator inspection — sshd cannot bind a Match
# block to an address, only to user / group / address as a predicate.
# We rely on the synapse-deployer user being SSH-reachable ONLY via the
# tailnet because the SSH client (Synapse central) only routes through
# Headscale, and on the forced-command wrapper to gate every command.
#
# Local tailnet address at install time: {{TAILNET_IP}}

Match User {{SSH_USER}}
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
    PermitTTY no
    ForceCommand /usr/local/bin/synapse-deployer-exec
