name: publish-image

# Builds the Synapse server image and pushes it to GHCR so a local stack
# can pull a patched build instead of compiling from source on every
# `docker compose up --build`.
#
# Built natively on an arm64 runner: the consumers of this image are
# Apple Silicon dev machines, and emulating the Go build under QEMU on an
# x86 runner is several times slower for no benefit.

on:
  push:
    branches:
      - fix/host-port-container-origin
  workflow_dispatch:

jobs:
  image:
    name: synapse image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./synapse
          platforms: linux/arm64
          push: true
          # SYNAPSE_VERSION in the local .env is human-readable and may
          # contain characters Docker rejects in a tag, so the image is
          # tagged by branch + commit instead and the version only rides
          # in as the binary's compile-time stamp.
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/bl4ckbl1zz/synapse:host-port-origin
            ghcr.io/bl4ckbl1zz/synapse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
